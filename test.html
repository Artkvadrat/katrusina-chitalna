<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Повноекранна карусель</title>
  <style>
      body {
          margin: 0;
          font-family: sans-serif;
          background: #f5f5f5;
      }

      .thumbnails {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 10px;
          padding: 20px;
      }

      .thumbnails img {
          width: 200px;
          cursor: pointer;
          border: 2px solid transparent;
          transition: 0.3s;
      }

      .thumbnails img:hover {
          border-color: #555;
      }

      .carousel {
          position: fixed;
          top: 0; left: 0;
          width: 100vw; height: 100vh;
          background: rgba(0, 0, 0, 0.9);
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          z-index: 9999;
      }

      .carousel img {
          max-width: 90%;
          max-height: 80vh;
          border-radius: 8px;
          box-shadow: 0 0 20px #000;
      }

      .carousel button {
          position: absolute;
          background: none;
          border: none;
          font-size: 2rem;
          color: white;
          cursor: pointer;
          user-select: none;
      }

      .prev { left: 20px; top: 50%; transform: translateY(-50%); }
      .next { right: 20px; top: 50%; transform: translateY(-50%); }
      .close-btn { top: 20px; right: 20px; }

      .hidden { display: none; }
  </style>
</head>
<body>

<!-- Мініатюри -->
<div class="thumbnails">
  <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" onclick="openCarousel(0)">
  <img src="https://images.unsplash.com/photo-1493244040629-496f6d136cc3?auto=format&fit=crop&w=600&q=80" onclick="openCarousel(1)">
  <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80" onclick="openCarousel(2)">
</div>

<!-- Карусель -->
<div id="carousel" class="carousel hidden">
  <button class="close-btn" onclick="closeCarousel()">×</button>
  <button class="prev" onclick="changeSlide(-1)">←</button>
  <img id="carousel-image" src="" alt="Картинка">
  <button class="next" onclick="changeSlide(1)">→</button>
</div>

<script>
  const images = [
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1493244040629-496f6d136cc3?auto=format&fit=crop&w=1200&q=80",
    "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80"
  ];
  let currentIndex = 0;

  const carousel = document.getElementById("carousel");
  const imageEl = document.getElementById("carousel-image");

  function openCarousel(index) {
    currentIndex = index;
    carousel.classList.remove("hidden");
    showSlide();
  }

  function closeCarousel() {
    carousel.classList.add("hidden");
  }

  function changeSlide(direction) {
    currentIndex += direction;
    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;
    showSlide();
  }

  function showSlide() {
    imageEl.src = images[currentIndex];
  }

  // Swipe підтримка
  let startX = 0;
  let endX = 0;

  carousel.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
  });

  carousel.addEventListener("touchend", (e) => {
    endX = e.changedTouches[0].clientX;
    handleSwipe();
  });

  function handleSwipe() {
    const diff = startX - endX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) {
        changeSlide(1); // Вліво
      } else {
        changeSlide(-1); // Вправо
      }
    }
  }
</script>
</body>
</html>
